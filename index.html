<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // التقاط المسار الفرعي من الرابط (مثل sea-bass-recipe)
        const pathSegments = window.location.pathname.split("/").filter(Boolean);
        
        if (pathSegments.length > 0) {
            const slug = pathSegments[pathSegments.length - 1];
            // التوجيه الفوري إلى المقالة المطابقة في موقعك الأصلي
            window.location.replace(`https://schnellrezept.com/en/${slug}/`);
        } else {
            window.location.replace("https://schnellrezept.com/");
        }
    </script>
</head>
<body>
    <p>Redirecting to your article... Please wait.</p>
</body>
</html>
