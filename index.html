<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // قراءة اسم المقالة من الـ Hash أو المسار
        const hash = window.location.hash.substring(1);
        const pathSegments = window.location.pathname.split("/").filter(Boolean);
        const slug = hash || (pathSegments.length > 0 ? pathSegments[pathSegments.length - 1] : "");

        if (slug) {
            window.location.replace(`https://schnellrezept.com/en/${slug}/`);
        } else {
            window.location.replace("https://schnellrezept.com/");
        }
    </script>
</head>
<body>
    <p>Redirecting... Please wait.</p>
</body>
</html>
